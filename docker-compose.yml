services:
  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && if [ \"$$DEMO_MODE\" = \"true\" ]; then python seed.py; fi && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/aajeevika.db}
      DEMO_MODE: ${DEMO_MODE:-true}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AUTO_CREATE_SCHEMA: "false"
      AUTH_SECRET: ${AUTH_SECRET:-local-demo-signing-key-change-before-deploy}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin-demo-change-me}
      DEMO_COUNSELLOR_USERNAME: ${DEMO_COUNSELLOR_USERNAME:-counsellor}
      DEMO_COUNSELLOR_PASSWORD: ${DEMO_COUNSELLOR_PASSWORD:-counsellor-demo-change-me}
    volumes: ["dbdata:/data"]
  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  dbdata:
