services:
  api:
    build: ./backend
    command: ["sh", "-c", "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/aajeevika.db
      DEMO_MODE: "true"
      FRONTEND_ORIGIN: http://localhost:3000
    volumes: ["dbdata:/data"]
  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  dbdata:
